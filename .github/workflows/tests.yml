name: Python tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, research-v2]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test benchmark scenarios
        run: |
          python simulator.py --sessions 3 --steps 120 --seed 100 --flow balanced
          python simulator.py --sessions 3 --steps 120 --seed 100 --flow one_sided
          python simulator.py --sessions 3 --steps 120 --seed 100 --flow informed
